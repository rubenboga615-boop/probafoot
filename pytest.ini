[pytest]
testpaths = tests
# La racine du dépôt doit être importable pour que `pytest -q` (la commande de
# CLAUDE.md) trouve les paquets ingestion/, moteur/, etc. sans dépendre du
# dossier courant ni de `python -m pytest`.
pythonpath = .
addopts = --strict-markers
markers =
    reseau: test exigeant un accès réseau réel ; jamais exécuté par défaut
